<script>
/* แสดงสาเหตุบนจอ ถ้าโหลดไม่ขึ้น (โค้ดวางไม่ครบ / เซิร์ฟเวอร์ไม่ตอบ) */
(function () {
  function show(title, msg) {
    var el = document.getElementById('loading');
    if (!el) return;
    el.innerHTML = '<div style="max-width:360px;padding:16px;font:14px/1.6 sans-serif;color:#161C2B"><b style="font-size:16px">' + title +
      '</b><p style="color:#5B6476;word-break:break-word">' + String(msg).replace(/[<>&]/g, '') + '</p>' +
      '<button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:0;background:#2741A6;color:#fff">ลองใหม่</button></div>';
  }
  window.__bootFail = show;
  window.addEventListener('error', function (e) {
    if (!e || !e.message) return;
    var ctx = '';
    try {
      var lines = document.documentElement.outerHTML.split('\n');
      var i = e.lineno - 1;
      for (var k = Math.max(0, i - 5); k <= Math.min(lines.length - 1, i + 1); k++) ctx += '[' + (k + 1) + '] ' + lines[k].trim().slice(0, 160) + '\n';
    } catch (x) {}
    show('โค้ดหน้าเว็บมีข้อผิดพลาด', e.message + ' (บรรทัด ' + e.lineno + ' / รวม ' + (document.documentElement.outerHTML.split('\n').length) + ' บรรทัด)');
    var el = document.getElementById('loading');
    if (el && ctx) {
      var pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap;font:12px/1.5 monospace;background:#fff;border:1px solid #ccc;padding:8px;max-width:360px;text-align:left;color:#000';
      pre.textContent = ctx;
      el.firstChild.appendChild(pre);
    }
  });
  setTimeout(function () {
    if (!window.__booted) show('โหลดนานผิดปกติ', window.__apiCalled
      ? 'หน้าเว็บส่งคำขอไปที่ชีตแล้วแต่ยังไม่ได้คำตอบ เปิด Apps Script → การดำเนินการ (Executions) ดูว่า getBootstrap ขึ้นข้อผิดพลาดอะไร'
      : 'โค้ดส่วนหลักของหน้าเว็บไม่ทำงาน ไฟล์ Index อาจวางไม่ครบ หรือยังไม่ได้ Deploy เวอร์ชันใหม่หลังวางโค้ด');
  }, 30000);
})();
</script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* หน้าจอมือถือ: แถบหัว + แผงกล้องคงที่ด้านบน (เฉพาะหน้าจัด/แพ็ค) + เนื้อหาเลื่อนได้ + แถบเมนูล่าง */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E3E6EC; --ink:#161C2B; --muted:#5B6476; --line:#D4D8E1;
  --ai:#2741A6; --ai-ink:#FFFFFF; --ai-soft:#E2E7F7;
  --ok:#17784A; --ok-soft:#DDF2E6; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#9A5B00; --warn-soft:#FCEFD6;
  --bar:#18213A; --bar-ink:#F2F4FA;
  --f-body:"IBM Plex Sans Thai","Noto Sans Myanmar",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F131C; --surface:#181E2B; --sunk:#222A3A; --ink:#E9ECF3; --muted:#9AA3B5; --line:#2D3648;
    --ai:#8FA5F5; --ai-ink:#0F131C; --ai-soft:#222C4A;
    --ok:#5CC98E; --ok-soft:#16301F; --bad:#F2877B; --bad-soft:#3A1916; --warn:#EBB65A; --warn-soft:#352813;
    --bar:#0A0D14; --bar-ink:#E9ECF3; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.code{font-family:var(--f-code);font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* หัว */
header{background:var(--bar);color:var(--bar-ink);padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;flex:none}
.logo{width:32px;height:32px;flex:none;border-radius:8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.65;letter-spacing:.04em;margin-top:-3px}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:5px 12px 5px 6px;color:inherit;font-size:13px}
.who i{width:22px;height:22px;border-radius:50%;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.sync{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.sync.err{background:var(--bad);color:#fff}
.sync.busy{background:rgba(255,255,255,.18)}

/* กล้อง */
#camPanel{flex:none;background:#000;position:relative;height:min(30vh,260px);overflow:hidden}
#cam{width:100%;height:100%}
#cam video{width:100%!important;height:100%!important;object-fit:cover}
#cam img{display:none}
#camOverlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;background:#0B0E15}
#camOverlay p{margin:0 0 10px;opacity:.8;font-size:13px}
.camBtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.camBtns button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px}
#camFb{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;border-radius:10px;padding:8px 12px;color:#fff;
  background:rgba(0,0,0,.6);transition:opacity .25s;opacity:0;pointer-events:none}
#camFb.show{opacity:1}
#camFb.ok{background:rgba(18,110,64,.93)} #camFb.bad{background:rgba(170,30,20,.94)} #camFb.warn{background:rgba(150,92,0,.94)}
#camFb b{display:block;font-size:20px;line-height:1.25}
#camFb span{font-size:13px;opacity:.9}
#camPanel.flash-ok{box-shadow:inset 0 0 0 5px #2FBF71} #camPanel.flash-bad{box-shadow:inset 0 0 0 5px #F04438}
.manual{flex:none;display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.manual input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.manual button{border:0;border-radius:10px;padding:0 14px;background:var(--ai);color:var(--ai-ink);font-weight:600}

/* เนื้อหา */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px))}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
h2{font-size:16px;margin:4px 2px 0;font-weight:700}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* แถบเมนูล่าง */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(6px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button[aria-current="true"]{color:var(--ai);background:var(--ai-soft)}
nav .badge{position:absolute;margin-left:20px;margin-top:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}

/* ชิป */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.ink{background:var(--ink);color:var(--surface)}

/* ตัวกรอง */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;border-width:1px}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11px;color:var(--muted)}
.tile.on{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.fgroup{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fgroup::-webkit-scrollbar{display:none}
.fgroup label{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap;min-width:34px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.selrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%;min-width:0}

/* การ์ดออเดอร์ */
.ord{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.ord-top{display:flex;align-items:baseline;gap:8px}
.ord-no{font-family:var(--f-code);font-weight:600;font-size:15px}
.ord-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-amt{font-variant-numeric:tabular-nums;font-weight:600}
.ord-meta{font-size:12px;color:var(--muted);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.bar.done i{background:var(--ok)}

/* หน้าจัด/แพ็ค */
.head{display:flex;flex-direction:column;gap:6px}
.head-top{display:flex;align-items:center;gap:8px}
.head .ord-no{font-size:20px}
.head .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.addr{font-size:13px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.alert{border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert button{margin-left:auto;border:0;border-radius:8px;padding:6px 12px;background:currentColor}
.alert button span{color:var(--surface)}
.prog{display:flex;align-items:baseline;gap:8px}
.prog b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:58px}
.it:first-child{border-top:0}
.it .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.it.done{background:var(--ok-soft)}
.it.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.it.part .tick{border-color:var(--ai);color:var(--ai);font-size:12px}
.it.skip{opacity:.55}
.it .code{font-size:17px}
.it .nm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .min{min-width:0;border:0;background:none;text-align:left;padding:0}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center}
.qty button.plus{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.it.flash{animation:fl .6s}
@keyframes fl{from{background:#9BE3BC}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.it.flash{animation:none}}
.choose{display:flex;flex-direction:column;gap:6px}

.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .st{position:absolute;left:4px;bottom:4px;font-size:10px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.ph .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.ph.add{border:2px dashed var(--ai);background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;cursor:pointer}
.ph.add svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:var(--ai);color:var(--ai-ink)}
.big.ok{background:var(--ok);color:#fff} .big.warn{background:var(--warn);color:#fff}
.big:disabled{opacity:.5}
.stickyBtn{position:sticky;bottom:0;box-shadow:0 -10px 16px var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.trk{display:flex;align-items:center;gap:6px;font-size:13px}

/* แผ่นล่าง */
.sheetBg{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.lrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ai)}
.lrow .grow{flex:1;min-width:0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.menu button b{display:block}
.menu button span{font-size:12px;color:var(--muted)}
.menu svg{width:26px;height:26px;color:var(--ai);flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--ai)}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sum td.n,table.sum th.n{text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:40;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff} #toast.ok{background:var(--ok);color:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;text-align:center}

/* ---- ฟีเจอร์ชุดที่ 2: สต็อก · สินค้าขาด · รอบหยิบรวม · จำนวนฉลาก ---- */
#camFb.bigfb b{font-size:30px;line-height:1.15}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.entry>svg{width:28px;height:28px;color:var(--ai);flex:none}
.entry .min{flex:1;min-width:0;display:flex;flex-direction:column}
.entry .min span{font-size:12px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.srow .min{flex:1;min-width:0}
.srow .code{font-size:16px}
.srow .nm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.srow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ai);flex:none}
.sthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.ph0{display:grid;place-items:center;color:var(--muted)}
.ph0 svg{width:26px;height:26px}
.need{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.need b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.need span{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpis span{display:block;font-size:11px;color:var(--muted)}
.kpis b{font-size:22px;font-variant-numeric:tabular-nums}
.kpis .bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.kpis .ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

.bk.done{background:var(--ok-soft);border-color:transparent}

.putbig{display:flex;align-items:center;gap:14px;background:var(--ai);color:var(--ai-ink);border-radius:var(--r);padding:12px 16px}

<script>



/* ================= ข้อมูลและสถานะ ================= */
const BATCH = { open: 'กำลังหยิบ', closed: 'ปิดแล้ว' };
const PICK = { none: 'ยังไม่จัด', part: 'จัดบางส่วน', done: 'จัดแล้ว' };
const PACK = { none: 'ยังไม่แพ็ค', part: 'แพ็คบางส่วน', done: 'แพ็คแล้ว' };
const PAY = { paid: 'โอนแล้ว', none: 'ยังไม่โอน', part: 'โอนไม่ครบ' };

const S = {
  view: 'orders', staff: '', staffList: [], carriers: [], sheetUrl: '',
  orders: [], itemsBy: {}, byNo: {}, byTrack: {}, codeIdx: {},
  f: { pick: 'all', pack: 'all', pay: 'all', picker: '', packer: '', date: '', q: '' },
  pickNo: null, pickChoices: null,
  pk: null, packChoices: null,
  more: null, imp: null, products: null, labelSel: new Set(), labelQ: '', labelOnlyOpen: true, labelSize: 's5030', labelSort: 'qty', lblQty: {},
  stock: {}, batches: [], batchId: null, batchStep: 'pick', lastPut: null, nb: { size: 10, paidOnly: true, busy: false },
  sk: null, stockQ: '', stockMulti: true, poQty: {}, poOff: new Set(), poVendor: '',
  set: { sound: true, autoCam: true, requirePhoto: false, lastCarrier: '' }
};

const LS = {
  get(k, d) {try {const v = localStorage.getItem('sp_' + k);return v == null ? d : JSON.parse(v);} catch (e) {return d;}},
  set(k, v) {try {localStorage.setItem('sp_' + k, JSON.stringify(v));} catch (e) {}},
  del(k) {try {localStorage.removeItem('sp_' + k);} catch (e) {}}
};
S.labelSort = LS.get('labelSort', 'qty') === 'code' ? 'code' : 'qty';

const norm = (s) => String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g, '').replace(/^#/, '');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&' + '#39;' })[c]);
const baht = (n) => '฿' + (Number(n) || 0).toLocaleString('th-TH');
const qtyOf = (i) => Number(i.qty) || 0;
const autoSkip = (i) => Number(i.price) < 0 || /โค้ด/.test(String(i.name || ''));
const isSkip = (i) => {const s = String(i.skip).trim().toUpperCase();return i.skip === true || s === 'ใช่' || s === 'TRUE' || s === 'Y' || autoSkip(i);};
const pickedOf = (i) => Math.max(0, Math.min(qtyOf(i), Number(i.pickedQty) || 0));
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
const nowStr = () => {const d = new Date();return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }) + ' ' + d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });};
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = (id) => document.getElementById(id);

function cleanScan(t) {
  t = String(t || '').trim();
  if (/%[0-9A-F]{2}/i.test(t)) {try {t = decodeURIComponent(t);} catch (e) {}}
  return t;
}

/* การเชื่อมต่อ: เปิดจากหน้าเว็บภายนอก (เช่น GitHub Pages) เพื่อให้ใช้กล้องได้ แล้วส่งคำขอไปที่ลิงก์ /exec ของ Google Sheet */
const hasGas = () => !!(window.google && google.script && google.script.run);
function getCfg() {return LS.get('cfg', null);}
function readHashCfg() {
  const h = location.hash.replace(/^#/, '');
  if (!/(^|&)u=/.test(h)) return;
  const p = {};
  h.split('&').forEach((kv) => {const i = kv.indexOf('=');if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));});
  if (p.u) LS.set('cfg', { url: p.u.trim(), key: (p.k || '').trim() });
  try {history.replaceState(null, '', location.pathname + location.search);} catch (e) {}
}
function shareLink() {
  const c = getCfg();if (!c) return '';
  return location.origin + location.pathname + '#u=' + encodeURIComponent(c.url) + '&k=' + encodeURIComponent(c.key);
}
function api(fn, ...args) {
  if (hasGas()) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  }
  if (window.MockApi) return new Promise((res, rej) => setTimeout(() => {try {res(MockApi[fn](...JSON.parse(JSON.stringify(args))));} catch (e) {rej(e);}}, 150));
  const c = getCfg();
  if (!c || !c.url) return Promise.reject(new Error('NEED_CFG'));
  return fetch(c.url, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, key: c.key })
  }).then((r) => r.text()).then((t) => {
    let j;
    try {j = JSON.parse(t);} catch (e) {
      throw new Error('ลิงก์ /exec ตอบกลับไม่ใช่ข้อมูล: ตรวจว่า Deploy ตั้ง "ผู้ที่มีสิทธิ์เข้าถึง" เป็น "ทุกคน" และวางโค้ด Code.gs เวอร์ชันล่าสุดแล้ว Deploy เวอร์ชันใหม่');
    }
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    return j.data;
  }, (e) => {throw new Error('เชื่อมต่อ Google Sheet ไม่ได้ ตรวจอินเทอร์เน็ต หรือลิงก์ /exec (' + errMsg(e) + ')');});
}
function showConnect(msg) {
  const c = getCfg() || { url: '', key: '' };
  $('loading').innerHTML = '<form class="card stack" id="connectForm" style="max-width:380px;width:calc(100% - 32px);text-align:left">' +
  '<b style="font-size:17px">เชื่อมต่อกับ Google Sheet</b>' + (
  msg ? '<div class="alert bad" style="font-size:13px">' + esc(msg) + '</div>' : '') +
  '<label class="field"><span>ลิงก์เว็บแอป (/exec) หรือวาง "ลิงก์สำหรับพนักงาน" ทั้งลิงก์</span><input id="cfgUrl" value="' + esc(c.url) + '" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>' +
  '<label class="field"><span>รหัสเข้าแอป (ดูในชีต Settings)</span><input id="cfgKey" value="' + esc(c.key) + '" autocomplete="off"></label>' +
  '<button class="big" type="submit">เชื่อมต่อ</button>' +
  '<div class="muted" style="font-size:12px">พนักงานไม่ต้องกรอกเอง: เจ้าของร้านส่ง "ลิงก์สำหรับพนักงาน" จากเมนู เพิ่มเติม ให้กดเปิดได้เลย</div></form>';
  $('connectForm').addEventListener('submit', (e) => {
    e.preventDefault();
    let url = $('cfgUrl').value.trim(),key = $('cfgKey').value.trim();
    const mm = url.match(/#u=([^&]+)(?:&k=([^&]*))?/);
    if (mm) {url = decodeURIComponent(mm[1]);if (mm[2] && !key) key = decodeURIComponent(mm[2]);}
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !/\/exec(\?|$)/.test(url)) {showConnect('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec');return;}
    LS.set('cfg', { url: url, key: key });
    location.reload();
  });
}
const errMsg = (e) => e && e.message ? e.message : String(e);

/* ---------- ดัชนีค้นหาในเครื่อง ---------- */
function itemsOf(o) {return S.itemsBy[norm(o.orderNo)] || [];}
function rebuild() {
  S.byNo = {};S.byTrack = {};S.codeIdx = {};
  S.orders.forEach((o) => {
    const k = norm(o.orderNo);
    S.byNo[k] = o;
    [o.vrichTracking, o.tracking].forEach((t) => {if (norm(t)) S.byTrack[norm(t)] = o;});
  });
  Object.keys(S.itemsBy).forEach((k) => S.itemsBy[k].forEach((i) => {
    const c = norm(i.code);
    (S.codeIdx[c] = S.codeIdx[c] || []).includes(k) || S.codeIdx[c].push(k);
  }));
}
function setData(d) {
  S.stock = {};(d.stock || []).forEach((r) => {S.stock[norm(r.code)] = r;});
  S.batches = (d.batches || []).slice();
  S.orders = (d.orders || []).slice();
  S.itemsBy = {};
  (d.items || []).forEach((i) => {const k = norm(i.orderNo);(S.itemsBy[k] = S.itemsBy[k] || []).push(i);});
  rebuild();
}
function findOrder(code) {const k = norm(code);return S.byNo[k] || S.byTrack[k] || null;}
function recalc(o) {
  const phys = itemsOf(o).filter((i) => !isSkip(i));
  const total = phys.reduce((s, i) => s + qtyOf(i), 0);
  const picked = phys.reduce((s, i) => s + pickedOf(i), 0);
  o.itemQty = total;o.pickedQty = picked;
  const prev = o.pickStatus;
  o.pickStatus = picked <= 0 ? PICK.none : picked >= total ? PICK.done : PICK.part;
  if (o.pickStatus === PICK.done && prev !== PICK.done) o.pickedAt = nowStr();
  if (o.pickStatus !== PICK.done) o.pickedAt = '';
}
function applyBundle(b) {
  if (!b || !b.order) return;
  const k = norm(b.order.orderNo);
  const idx = S.orders.findIndex((o) => norm(o.orderNo) === k);
  if (idx >= 0) Object.assign(S.orders[idx], b.order);else S.orders.unshift(b.order);
  S.itemsBy[k] = b.items || [];
  rebuild();
}

/* ================= คิวบันทึก (สแกนแล้วไปต่อทันที บันทึกลงชีตเบื้องหลัง) ================= */
const Q = { list: LS.get('queue', []), busy: false, timer: null, fails: 0 };
function qSave() {LS.set('queue', Q.list);syncBadge();}
function enqueue(op) {
  const last = Q.list[Q.list.length - 1];
  if (op.type === 'pick' && last && last.type === 'pick' && !last.sent && last.orderNo === op.orderNo && last.staff === op.staff) {
    Object.keys(op.deltas).forEach((c) => {last.deltas[c] = (last.deltas[c] || 0) + op.deltas[c];});
  } else if (op.type === 'batch' && last && last.type === 'batch' && !last.sent && last.id === op.id) {
    Object.assign(last.patch, op.patch);
  } else if (op.type === 'stock' && last && last.type === 'stock' && !last.sent && last.key === op.key) {
    last.rec = op.rec;
  } else Q.list.push(Object.assign({ id: uid() }, op));
  qSave();qKick(450);
}
function qKick(ms) {clearTimeout(Q.timer);Q.timer = setTimeout(qRun, ms || 0);}
async function qRun() {

        const changes = Object.keys(op.deltas).filter((c) => op.deltas[c]).map((c) => ({ code: c, delta: op.deltas[c] }));
        b = changes.length ? await api('savePick', op.orderNo, changes, op.staff) : null;
      } else if (op.type === 'pack') b = await api('savePack', op.orderNo, op.payload);else
      if (op.type === 'reset') b = await api('resetStatus', op.orderNo, op.which, op.staff);else
      if (op.type === 'stock') {const r = await api('saveStock', op.rec);if (!Q.list.slice(1).some((x) => x.type === 'stock' && x.key === op.key)) {const loc = S.stock[op.key] || {};S.stock[op.key] = Object.assign({}, r, { thumb: r.thumb || loc.thumb || '' });}} else
      if (op.type === 'ordered') {const rows = await api('markOrdered', op.codes, op.staff);(rows || []).forEach((r) => {const k = norm(r.code);S.stock[k] = Object.assign({}, S.stock[k] || {}, { ordered: r.ordered });});} else
      if (op.type === 'batch') {const r = await api('saveBatch', op.id, op.patch, op.staff);if (r && !Q.list.slice(1).some((x) => x.type === 'batch' && x.id === op.id)) {const i = S.batches.findIndex((x) => x.id === r.id);if (i >= 0) S.batches[i] = r;}}
      Q.list.shift();Q.fails = 0;qSave();
      if (b && b.order && !Q.list.some((x) => x.orderNo === op.orderNo)) applyBundle(b);
      softRender();
    } catch (e) {
      op.sent = false;Q.fails++;qSave();
      const m = errMsg(e);
      if (/ไม่พบออเดอร์/.test(m)) {Q.list.shift();qSave();toast(m, 'bad');continue;}
      $('sync').className = 'sync err';$('sync').textContent = 'บันทึกไม่ได้ ลองใหม่…';

    }

  if ((o.packStatus === PACK.done || o.packStatus === PACK.part) && !saved) {

  }

function packSave() {if (S.pk) LS.set(packDraftKey(S.pk.no), Object.assign({}, S.pk, { photos: S.pk.photos.filter((p) => p.status === 'ok') }));}
function packCounts(o) {

}
function packWarn(o) {

  if (o.packStatus === PACK.part) return { kind: 'warn', msg: '#' + o.orderNo + ' แพ็คบางส่วน รอของ', sub: 'รอ: ' + (missingText(o) || '-') };
  if (o.pickStatus !== PICK.done) return { kind: 'warn', msg: '#' + o.orderNo + ' ยังจัดไม่ครบ', sub: 'จัดแล้ว ' + (o.pickedQty || 0) + '/' + (o.itemQty || 0) + ' ชิ้น' };
  if (o.payStatus !== PAY.paid) return { kind: 'warn', msg: '#' + o.orderNo + ' ' + o.payStatus, sub: o.customer };
  return { ok: true, msg: '#' + o.orderNo, sub: o.customer + ' · ' + (o.itemQty || 0) + ' ชิ้น' };
}
function packScan(code) {
  const k = norm(code);
  const cur = S.pk && S.byNo[S.pk.no];
  if (cur) {
    const it = itemsOf(cur).find((i) => norm(i.code) === k && !isSkip(i));
    if (it) {
      const n = S.pk.packed[it.code] || 0,q = qtyOf(it);
      if (n >= q) return { ok: false, msg: it.code + ' ครบแล้ว', sub: 'ต้องการ ' + q + ' ชิ้น' };
      S.pk.packed[it.code] = n + 1;S.pk.confirm = null;packSave();
      S.flashCode = norm(it.code);softRender();
      const c = packCounts(cur);
      const warnPick = pickedOf(it) < n + 1 ? ' (หน้าจัดยังไม่ได้ติ๊ก)' : '';
      return { ok: true, msg: it.code + '  ' + (n + 1) + '/' + q, sub: (c.done >= c.total ? 'ครบทุกชิ้นแล้ว ถ่ายรูปแล้วกดแพ็คเสร็จ' : 'เหลือ ' + (c.total - c.done) + ' ชิ้น') + warnPick };
    }

      return { ok: true, msg: 'ใบปะหน้าตรงกับออเดอร์ ✓', sub: code };

      S.packChoices = { switchTo: norm(other.orderNo) };softRender();
      return { ok: false, msg: 'เป็นของออเดอร์ #' + other.orderNo, sub: 'ใบปะหน้า/ออเดอร์ไม่ตรง ถ้าจะสลับให้กดปุ่มด้านล่าง' };

// ออเดอร์ที่คนอื่นเพิ่งนำเข้า หรือเก่ากว่า 14 วัน: ถามจากชีตโดยตรง

  if (S.set.requirePhoto && !photos.length) return feedback({ ok: false, msg: 'ต้องถ่ายรูปกล่องก่อน', sub: 'ตั้งค่าให้บังคับถ่ายรูป' });

  }

  const lacking = c.total - c.done;

  orderHead(o, 'pack') + "\n    " + (
  o.packStatus === PACK.done ? "<div class=\"alert warn\">\u0E41\u0E1E\u0E47\u0E04\u0E44\u0E1B\u0E41\u0E25\u0E49\u0E27\u0E42\u0E14\u0E22 " + esc(o.packedBy || '-') + " " + esc(o.packedAt || '') + "</div>" : '') + (

  S.packChoices && S.packChoices.switchTo ? "<div class=\"alert bad\">\u0E2A\u0E41\u0E01\u0E19\u0E40\u0E08\u0E2D\u0E02\u0E2D\u0E07\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C #" + esc(S.byNo[S.packChoices.switchTo].orderNo) + "<button data-act=\"openPack\" data-no=\"" + esc(S.packChoices.switchTo) + "\"><span>\u0E2A\u0E25\u0E31\u0E1A</span></button></div>" : '') + "\n    <div class=\"prog\"><b>" +
  c.done + "/" + c.total + "</b><span class=\"muted\">\u0E0A\u0E34\u0E49\u0E19 \u0E2A\u0E41\u0E01\u0E19\u0E25\u0E07\u0E01\u0E25\u0E48\u0E2D\u0E07\u0E41\u0E25\u0E49\u0E27</span></div>\n    <div class=\"bar " + (

  items.map((i) => itemRow(i, Math.min(qtyOf(i), pk.packed[i.code] || 0), 'pack')).join('') + "</div>\n    <div class=\"card stack\">\n      <div class=\"row2\">\n        <label class=\"field\"><span>\u0E02\u0E19\u0E2A\u0E48\u0E07</span><select id=\"pkCarrier\">" +

  label + "</div>\n      <div class=\"field\"><span>\u0E23\u0E39\u0E1B\u0E2B\u0E25\u0E31\u0E01\u0E10\u0E32\u0E19\u0E01\u0E32\u0E23\u0E41\u0E1E\u0E47\u0E04 " + (

function labelList() {

  const byCode = (a, b) => a.code.localeCompare(b.code, 'th', { numeric: true });
  const arr = Object.values(m).sort(byCode);
  if (S.labelSort === 'qty') arr.sort((a, b) => soldQty(b.code) - soldQty(a.code) || byCode(a, b));
  return arr;

async function readVrich(file) {
  S.more = 'import';S.imp = null;go('more');
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    let orderRows = null,stockRows = [];
    wb.SheetNames.forEach((n) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '' });
      if (!rows.length) return;
      const keys = Object.keys(rows[0]);
      if (keys.includes('เลขที่ Order') && keys.includes('รหัสสินค้า')) orderRows = rows;else
      if (keys.includes('รหัสสินค้า') && keys.includes('ยอดคงเหลือ')) stockRows = rows;
    });
    if (!orderRows) throw new Error('ไม่พบชีตออเดอร์ (ต้องมีคอลัมน์ "เลขที่ Order" และ "รหัสสินค้า") ใช้ไฟล์ export ออเดอร์จาก Vrich');
    const d = (v) => v instanceof Date ? v.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }) : String(v || '').slice(0, 10);
    const str = (v) => String(v == null ? '' : v).trim();
    const phone = (v) => {let s = str(v).replace(/\D/g, '');if (s.length === 9) s = '0' + s;return s;};
    const n = (v) => Number(String(v).replace(/,/g, '')) || 0;
    const orders = {},items = {};
    orderRows.forEach((r) => {
      const no = str(r['เลขที่ Order']);if (!no) return;
      if (!orders[no]) orders[no] = {
        orderNo: no, date: d(r['วันที่']), fbName: str(r['ชื่อ Facebook']), customer: str(r['ชื่อลูกค้า']),
        phone: phone(r['โทรศัพท์']), address: str(r['ที่อยู่']), province: str(r['จังหวัด']), zip: str(r['รหัสไปรษณีย์']),
        note: str(r['หมายเหตุ']), hold: n(r['มีของฝาก']), vrichCarrier: str(r['ขนส่ง']), vrichTracking: str(r['เลขพัสดุ']),
        amount: n(r['จำนวนเงิน']), discount: n(r['ส่วนลด']), shipping: n(r['ค่าส่ง']), total: n(r['รวม']), paid: n(r['โอนแล้ว'])
      };
      const code = str(r['รหัสสินค้า']);if (!code) return;
      const key = no + '|' + norm(code);
      if (items[key]) items[key].qty += n(r['จำนวน']) || 1;else
      items[key] = { orderNo: no, code: code, name: str(r['รายละเอียด']), qty: n(r['จำนวน']) || 1, price: n(r['ราคา']) };
    });
    const products = stockRows.map((r) => ({ code: str(r['รหัสสินค้า']), stockCode: str(r['รหัสสต็อก']), name: str(r['รายละเอียด']), price: n(r['ราคา']), qty: n(r['จำนวน']), sold: n(r['ขายไป']), remain: n(r['ยอดคงเหลือ']) })).filter((p) => p.code);
    S.imp = { fileName: file.name, orders: Object.values(orders), items: Object.values(items), products: products };
  } catch (e) {S.imp = { error: errMsg(e) };}
  render();
}

function needsOf(orders) {

  bStep: (d) => {S.batchStep = d.s;render();$('main').scrollTop = 0;},
  nbSize: (d) => {S.nb.size = Number(d.n);LS.set('nb', { size: S.nb.size, paidOnly: S.nb.paidOnly });render();},
  bCreate: async () => {
    const ns = needStaff();if (ns) return feedback(ns);
    const cand = batchCandidates();if (!cand.length || S.nb.busy) return;
    S.nb.busy = true;render();
    try {
      const b = await api('createBatch', cand.map((o) => String(o.orderNo)), S.staff);
      S.batches.push(b);S.batchId = b.id;S.batchStep = 'pick';S.lastPut = null;
      feedback({ ok: true, msg: 'สร้างรอบ ' + b.id, sub: parseJ(b.orders, []).length + ' ออเดอร์ · เริ่มหยิบรวมได้เลย' });
    } catch (e) {toast('สร้างรอบไม่ได้: ' + errMsg(e), 'bad');}
    S.nb.busy = false;render();$('main').scrollTop = 0;
  },
  bInc: (d) => {const b = curBatch();if (!b) return;const r = batchInc(b, d.c, Number(d.d));if (r && r.ok === false) feedback(r);else if (r && Number(d.d) > 0) beep('ok');},
  bPrint: () => {const b = curBatch();if (b) printBatch(b);},
  bClose: () => {
    const b = curBatch();if (!b) return;
    if (S.confirmReset !== 'batch' + b.id) {S.confirmReset = 'batch' + b.id;render();return;}
    S.confirmReset = null;b.status = BATCH.closed;b.closedAt = nowStr();
    enqueue({ type: 'batch', id: b.id, patch: { status: BATCH.closed }, staff: S.staff });
    S.batchId = null;toast('ปิดรอบ ' + b.id + ' แล้ว', 'ok');render();
  },
  bReopen: () => {const b = curBatch();if (!b) return;b.status = BATCH.open;b.closedAt = '';enqueue({ type: 'batch', id: b.id, patch: { status: BATCH.open }, staff: S.staff });render();},
  holdPack: () => holdPack(),
  lq: (d) => {const k = norm(d.c);S.lblQty[k] = Math.max(1, lblQty(d.c) + Number(d.d));render();}
});
