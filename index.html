<script>
/* แสดงสาเหตุบนจอ ถ้าโหลดไม่ขึ้น (โค้ดวางไม่ครบ / เซิร์ฟเวอร์ไม่ตอบ) */
(function () {
  function show(title, msg) {
    var el = document.getElementById('loading');
    if (!el) return;
    el.innerHTML = '<div style="max-width:360px;padding:16px;font:14px/1.6 sans-serif;color:#161C2B"><b style="font-size:16px">' + title +
      '</b><p style="color:#5B6476;word-break:break-word">' + String(msg).replace(/[<>&]/g, '') + '</p>' +
      '<button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:0;background:#2741A6;color:#fff">ลองใหม่</button></div>';
  }
  window.__bootFail = show;
  window.addEventListener('error', function (e) {
    if (!e || !e.message) return;
    var ctx = '';
    try {
      var lines = document.documentElement.outerHTML.split('\n');
      var i = e.lineno - 1;
      for (var k = Math.max(0, i - 5); k <= Math.min(lines.length - 1, i + 1); k++) ctx += '[' + (k + 1) + '] ' + lines[k].trim().slice(0, 160) + '\n';
    } catch (x) {}
    show('โค้ดหน้าเว็บมีข้อผิดพลาด', e.message + ' (บรรทัด ' + e.lineno + ' / รวม ' + (document.documentElement.outerHTML.split('\n').length) + ' บรรทัด)');
    var el = document.getElementById('loading');
    if (el && ctx) {
      var pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap;font:12px/1.5 monospace;background:#fff;border:1px solid #ccc;padding:8px;max-width:360px;text-align:left;color:#000';
      pre.textContent = ctx;
      el.firstChild.appendChild(pre);
    }
  });
  setTimeout(function () {
    if (!window.__booted) show('โหลดนานผิดปกติ', window.__apiCalled
      ? 'หน้าเว็บส่งคำขอไปที่ชีตแล้วแต่ยังไม่ได้คำตอบ เปิด Apps Script → การดำเนินการ (Executions) ดูว่า getBootstrap ขึ้นข้อผิดพลาดอะไร'
      : 'โค้ดส่วนหลักของหน้าเว็บไม่ทำงาน ไฟล์ Index อาจวางไม่ครบ หรือยังไม่ได้ Deploy เวอร์ชันใหม่หลังวางโค้ด');
  }, 30000);
})();
</script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* หน้าจอมือถือ: แถบหัว + แผงกล้องคงที่ด้านบน (เฉพาะหน้าจัด/แพ็ค) + เนื้อหาเลื่อนได้ + แถบเมนูล่าง */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E3E6EC; --ink:#161C2B; --muted:#5B6476; --line:#D4D8E1;
  --ai:#2741A6; --ai-ink:#FFFFFF; --ai-soft:#E2E7F7;
  --ok:#17784A; --ok-soft:#DDF2E6; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#9A5B00; --warn-soft:#FCEFD6;
  --bar:#18213A; --bar-ink:#F2F4FA;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F131C; --surface:#181E2B; --sunk:#222A3A; --ink:#E9ECF3; --muted:#9AA3B5; --line:#2D3648;
    --ai:#8FA5F5; --ai-ink:#0F131C; --ai-soft:#222C4A;
    --ok:#5CC98E; --ok-soft:#16301F; --bad:#F2877B; --bad-soft:#3A1916; --warn:#EBB65A; --warn-soft:#352813;
    --bar:#0A0D14; --bar-ink:#E9ECF3; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.code{font-family:var(--f-code);font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* หัว */
header{background:var(--bar);color:var(--bar-ink);padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;flex:none}
.logo{width:32px;height:32px;flex:none;border-radius:8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.65;letter-spacing:.04em;margin-top:-3px}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:5px 12px 5px 6px;color:inherit;font-size:13px}
.who i{width:22px;height:22px;border-radius:50%;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.sync{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.sync.err{background:var(--bad);color:#fff}
.sync.busy{background:rgba(255,255,255,.18)}

/* กล้อง */
#camPanel{flex:none;background:#000;position:relative;height:min(30vh,260px);overflow:hidden}
#cam{width:100%;height:100%}
#cam video{width:100%!important;height:100%!important;object-fit:cover}
#cam img{display:none}
#camOverlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;background:#0B0E15}
#camOverlay p{margin:0 0 10px;opacity:.8;font-size:13px}
.camBtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.camBtns button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px}
#camFb{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;border-radius:10px;padding:8px 12px;color:#fff;
  background:rgba(0,0,0,.6);transition:opacity .25s;opacity:0;pointer-events:none}
#camFb.show{opacity:1}
#camFb.ok{background:rgba(18,110,64,.93)} #camFb.bad{background:rgba(170,30,20,.94)} #camFb.warn{background:rgba(150,92,0,.94)}
#camFb b{display:block;font-size:20px;line-height:1.25}
#camFb span{font-size:13px;opacity:.9}
#camPanel.flash-ok{box-shadow:inset 0 0 0 5px #2FBF71} #camPanel.flash-bad{box-shadow:inset 0 0 0 5px #F04438}
.manual{flex:none;display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.manual input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.manual button{border:0;border-radius:10px;padding:0 14px;background:var(--ai);color:var(--ai-ink);font-weight:600}

/* เนื้อหา */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px))}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
h2{font-size:16px;margin:4px 2px 0;font-weight:700}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* แถบเมนูล่าง */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(6px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button[aria-current="true"]{color:var(--ai);background:var(--ai-soft)}
nav .badge{position:absolute;margin-left:20px;margin-top:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}

/* ชิป */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.ink{background:var(--ink);color:var(--surface)}

/* ตัวกรอง */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;border-width:1px}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11px;color:var(--muted)}
.tile.on{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.fgroup{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fgroup::-webkit-scrollbar{display:none}
.fgroup label{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap;min-width:34px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.selrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%;min-width:0}

/* การ์ดออเดอร์ */
.ord{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.ord-top{display:flex;align-items:baseline;gap:8px}
.ord-no{font-family:var(--f-code);font-weight:600;font-size:15px}
.ord-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-amt{font-variant-numeric:tabular-nums;font-weight:600}
.ord-meta{font-size:12px;color:var(--muted);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.bar.done i{background:var(--ok)}

/* หน้าจัด/แพ็ค */
.head{display:flex;flex-direction:column;gap:6px}
.head-top{display:flex;align-items:center;gap:8px}
.head .ord-no{font-size:20px}
.head .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.addr{font-size:13px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.alert{border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert button{margin-left:auto;border:0;border-radius:8px;padding:6px 12px;background:currentColor}
.alert button span{color:var(--surface)}
.prog{display:flex;align-items:baseline;gap:8px}
.prog b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:58px}
.it:first-child{border-top:0}
.it .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.it.done{background:var(--ok-soft)}
.it.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.it.part .tick{border-color:var(--ai);color:var(--ai);font-size:12px}
.it.skip{opacity:.55}
.it .code{font-size:17px}
.it .nm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .min{min-width:0;border:0;background:none;text-align:left;padding:0}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center}
.qty button.plus{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.it.flash{animation:fl .6s}
@keyframes fl{from{background:#9BE3BC}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.it.flash{animation:none}}
.choose{display:flex;flex-direction:column;gap:6px}

.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .st{position:absolute;left:4px;bottom:4px;font-size:10px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.ph .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.ph.add{border:2px dashed var(--ai);background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;cursor:pointer}
.ph.add svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:var(--ai);color:var(--ai-ink)}
.big.ok{background:var(--ok);color:#fff} .big.warn{background:var(--warn);color:#fff}
.big:disabled{opacity:.5}
.stickyBtn{position:sticky;bottom:0;box-shadow:0 -10px 16px var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.trk{display:flex;align-items:center;gap:6px;font-size:13px}

/* แผ่นล่าง */
.sheetBg{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.lrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ai)}
.lrow .grow{flex:1;min-width:0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.menu button b{display:block}
.menu button span{font-size:12px;color:var(--muted)}
.menu svg{width:26px;height:26px;color:var(--ai);flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--ai)}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sum td.n,table.sum th.n{text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:40;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff} #toast.ok{background:var(--ok);color:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;text-align:center}
#printArea{display:none}

/* พิมพ์ฉลาก */
@media print{
  body{display:block;overflow:visible;background:#fff;height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .lbl{page-break-inside:avoid;break-inside:avoid;display:flex;gap:2mm;align-items:center;color:#000;overflow:hidden;font-family:var(--f-body)}
  .lbl img{flex:none}
  .lbl .t{min-width:0}
  .lbl .c{font-family:var(--f-code);font-weight:700;line-height:1.05}
  .lbl .n{line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lbl .p{font-weight:700}
  .s5030 .lbl{width:50mm;height:30mm;padding:2mm;page-break-after:always;break-after:page}
  .s5030 .lbl img{width:24mm;height:24mm} .s5030 .c{font-size:14pt} .s5030 .n{font-size:7pt} .s5030 .p{font-size:9pt}
  .sA4{display:grid!important;grid-template-columns:repeat(3,63.5mm);grid-auto-rows:38.1mm;justify-content:center}
  .sA4 .lbl{padding:3mm;border:0.2mm dashed #bbb}
  .sA4 .lbl img{width:30mm;height:30mm} .sA4 .c{font-size:15pt} .sA4 .n{font-size:8pt} .sA4 .p{font-size:10pt}
}
</style>

<script>

/* ================= ข้อมูลและสถานะ ================= */
const PICK = { none: 'ยังไม่จัด', part: 'จัดบางส่วน', done: 'จัดแล้ว' };
const PACK = { none: 'ยังไม่แพ็ค', done: 'แพ็คแล้ว' };
const PAY = { paid: 'โอนแล้ว', none: 'ยังไม่โอน', part: 'โอนไม่ครบ' };

const S = {
  view: 'orders', staff: '', staffList: [], carriers: [], sheetUrl: '',
  orders: [], itemsBy: {}, byNo: {}, byTrack: {}, codeIdx: {},
  f: { pick: 'all', pack: 'all', pay: 'all', picker: '', packer: '', date: '', q: '' },
  pickNo: null, pickChoices: null,
  pk: null, packChoices: null,
  more: null, imp: null, products: null, labelSel: new Set(), labelQ: '', labelOnlyOpen: true, labelSize: 's5030',
  set: { sound: true, autoCam: true, requirePhoto: false, lastCarrier: '' }
};

const LS = {
  get(k, d) {try {const v = localStorage.getItem('sp_' + k);return v == null ? d : JSON.parse(v);} catch (e) {return d;}},
  set(k, v) {try {localStorage.setItem('sp_' + k, JSON.stringify(v));} catch (e) {}},
  del(k) {try {localStorage.removeItem('sp_' + k);} catch (e) {}}
};

const norm = (s) => String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g, '').replace(/^#/, '');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&' + '#39;' })[c]);
const baht = (n) => '฿' + (Number(n) || 0).toLocaleString('th-TH');
const qtyOf = (i) => Number(i.qty) || 0;
const isSkip = (i) => {const s = String(i.skip).trim().toUpperCase();return i.skip === true || s === 'ใช่' || s === 'TRUE' || s === 'Y';};
const pickedOf = (i) => Math.max(0, Math.min(qtyOf(i), Number(i.pickedQty) || 0));
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
const nowStr = () => {const d = new Date();return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }) + ' ' + d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });};
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = (id) => document.getElementById(id);

function cleanScan(t) {
  t = String(t || '').trim();
  if (/%[0-9A-F]{2}/i.test(t)) {try {t = decodeURIComponent(t);} catch (e) {}}
  return t;
}

/* การเชื่อมต่อ: เปิดจากหน้าเว็บภายนอก (เช่น GitHub Pages) เพื่อให้ใช้กล้องได้ แล้วส่งคำขอไปที่ลิงก์ /exec ของ Google Sheet */
const hasGas = () => !!(window.google && google.script && google.script.run);
function getCfg() { return LS.get('cfg', null); }
function readHashCfg() {
  const h = location.hash.replace(/^#/, '');
  if (!/(^|&)u=/.test(h)) return;
  const p = {};
  h.split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  if (p.u) LS.set('cfg', { url: p.u.trim(), key: (p.k || '').trim() });
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
function shareLink() {
  const c = getCfg(); if (!c) return '';
  return location.origin + location.pathname + '#u=' + encodeURIComponent(c.url) + '&k=' + encodeURIComponent(c.key);
}
function api(fn, ...args) {
  if (hasGas()) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  }
  if (window.MockApi) return new Promise((res, rej) => setTimeout(() => {try {res(MockApi[fn](...JSON.parse(JSON.stringify(args))));} catch (e) {rej(e);}}, 150));
  const c = getCfg();
  if (!c || !c.url) return Promise.reject(new Error('NEED_CFG'));
  return fetch(c.url, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, key: c.key })
  }).then(r => r.text()).then(t => {
    let j;
    try { j = JSON.parse(t); } catch (e) {
      throw new Error('ลิงก์ /exec ตอบกลับไม่ใช่ข้อมูล: ตรวจว่า Deploy ตั้ง "ผู้ที่มีสิทธิ์เข้าถึง" เป็น "ทุกคน" และวางโค้ด Code.gs เวอร์ชันล่าสุดแล้ว Deploy เวอร์ชันใหม่');
    }
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    return j.data;
  }, e => { throw new Error('เชื่อมต่อ Google Sheet ไม่ได้ ตรวจอินเทอร์เน็ต หรือลิงก์ /exec (' + errMsg(e) + ')'); });
}
function showConnect(msg) {
  const c = getCfg() || { url: '', key: '' };
  $('loading').innerHTML = '<form class="card stack" id="connectForm" style="max-width:380px;width:calc(100% - 32px);text-align:left">' +
    '<b style="font-size:17px">เชื่อมต่อกับ Google Sheet</b>' +
    (msg ? '<div class="alert bad" style="font-size:13px">' + esc(msg) + '</div>' : '') +
    '<label class="field"><span>ลิงก์เว็บแอป (/exec) หรือวาง "ลิงก์สำหรับพนักงาน" ทั้งลิงก์</span><input id="cfgUrl" value="' + esc(c.url) + '" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>' +
    '<label class="field"><span>รหัสเข้าแอป (ดูในชีต Settings)</span><input id="cfgKey" value="' + esc(c.key) + '" autocomplete="off"></label>' +
    '<button class="big" type="submit">เชื่อมต่อ</button>' +
    '<div class="muted" style="font-size:12px">พนักงานไม่ต้องกรอกเอง: เจ้าของร้านส่ง "ลิงก์สำหรับพนักงาน" จากเมนู เพิ่มเติม ให้กดเปิดได้เลย</div></form>';
  $('connectForm').addEventListener('submit', e => {
    e.preventDefault();
    let url = $('cfgUrl').value.trim(), key = $('cfgKey').value.trim();
    const mm = url.match(/#u=([^&]+)(?:&k=([^&]*))?/);
    if (mm) { url = decodeURIComponent(mm[1]); if (mm[2] && !key) key = decodeURIComponent(mm[2]); }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !/\/exec(\?|$)/.test(url)) { showConnect('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec'); return; }
    LS.set('cfg', { url: url, key: key });
    location.reload();
  });
}
const errMsg = (e) => e && e.message ? e.message : String(e);

/* ---------- ดัชนีค้นหาในเครื่อง ---------- */
function itemsOf(o) {return S.itemsBy[norm(o.orderNo)] || [];}
function rebuild() {
  S.byNo = {};S.byTrack = {};S.codeIdx = {};
  S.orders.forEach((o) => {
    const k = norm(o.orderNo);
    S.byNo[k] = o;
    [o.vrichTracking, o.tracking].forEach((t) => {if (norm(t)) S.byTrack[norm(t)] = o;});
  });
  Object.keys(S.itemsBy).forEach((k) => S.itemsBy[k].forEach((i) => {
    const c = norm(i.code);
    (S.codeIdx[c] = S.codeIdx[c] || []).includes(k) || S.codeIdx[c].push(k);
  }));
}
function setData(d) {
  S.orders = (d.orders || []).slice();
  S.itemsBy = {};
  (d.items || []).forEach((i) => {const k = norm(i.orderNo);(S.itemsBy[k] = S.itemsBy[k] || []).push(i);});
  rebuild();
}
function findOrder(code) {const k = norm(code);return S.byNo[k] || S.byTrack[k] || null;}
function recalc(o) {
  const phys = itemsOf(o).filter((i) => !isSkip(i));
  const total = phys.reduce((s, i) => s + qtyOf(i), 0);
  const picked = phys.reduce((s, i) => s + pickedOf(i), 0);
  o.itemQty = total;o.pickedQty = picked;
  const prev = o.pickStatus;
  o.pickStatus = picked <= 0 ? PICK.none : picked >= total ? PICK.done : PICK.part;
  if (o.pickStatus === PICK.done && prev !== PICK.done) o.pickedAt = nowStr();
  if (o.pickStatus !== PICK.done) o.pickedAt = '';
}
function applyBundle(b) {
  if (!b || !b.order) return;
  const k = norm(b.order.orderNo);
  const idx = S.orders.findIndex((o) => norm(o.orderNo) === k);
  if (idx >= 0) Object.assign(S.orders[idx], b.order);else S.orders.unshift(b.order);
  S.itemsBy[k] = b.items || [];
  rebuild();
}

/* ================= คิวบันทึก (สแกนแล้วไปต่อทันที บันทึกลงชีตเบื้องหลัง) ================= */
const Q = { list: LS.get('queue', []), busy: false, timer: null, fails: 0 };
function qSave() {LS.set('queue', Q.list);syncBadge();}
function enqueue(op) {
  const last = Q.list[Q.list.length - 1];
  if (op.type === 'pick' && last && last.type === 'pick' && !last.sent && last.orderNo === op.orderNo && last.staff === op.staff) {
    Object.keys(op.deltas).forEach((c) => {last.deltas[c] = (last.deltas[c] || 0) + op.deltas[c];});
  } else Q.list.push(Object.assign({ id: uid() }, op));
  qSave();qKick(450);
}
function qKick(ms) {clearTimeout(Q.timer);Q.timer = setTimeout(qRun, ms || 0);}
async function qRun() {
  if (Q.busy) return;
  Q.busy = true;
  while (Q.list.length) {
    const op = Q.list[0];
    op.sent = true;syncBadge();
    try {
      let b;
      if (op.type === 'pick') {
        const changes = Object.keys(op.deltas).filter((c) => op.deltas[c]).map((c) => ({ code: c, delta: op.deltas[c] }));
        b = changes.length ? await api('savePick', op.orderNo, changes, op.staff) : null;
      } else if (op.type === 'pack') b = await api('savePack', op.orderNo, op.payload);else
      if (op.type === 'reset') b = await api('resetStatus', op.orderNo, op.which, op.staff);
      Q.list.shift();Q.fails = 0;qSave();
      if (b && !Q.list.some((x) => x.orderNo === op.orderNo)) {applyBundle(b);softRender();}
    } catch (e) {
      op.sent = false;Q.fails++;qSave();
      const m = errMsg(e);
      if (/ไม่พบออเดอร์/.test(m)) {Q.list.shift();qSave();toast(m, 'bad');continue;}
      $('sync').className = 'sync err';$('sync').textContent = 'บันทึกไม่ได้ ลองใหม่…';
      Q.busy = false;qKick(Math.min(20000, 2500 * Q.fails));return;
    }
  }
  Q.busy = false;syncBadge();
}
function syncBadge() {
  const el = $('sync');const n = Q.list.length;
  if (!n) {el.className = 'sync';el.textContent = 'บันทึกแล้ว';} else
  if (Q.fails) {el.className = 'sync err';el.textContent = 'รอส่ง ' + n;} else
  {el.className = 'sync busy';el.textContent = 'กำลังบันทึก ' + n;}
}

/* ================= เสียง / สั่น / ข้อความ ================= */
let AC = null;
document.addEventListener('pointerdown', () => {try {AC = AC || new (window.AudioContext || window.webkitAudioContext)();AC.resume();} catch (e) {}}, { once: true });
function beep(kind) {
  if (S.set.sound && AC) {
    try {
      const o = AC.createOscillator(),g = AC.createGain();
      o.type = 'square';o.frequency.value = kind === 'ok' ? 1400 : kind === 'warn' ? 700 : 240;
      g.gain.value = 0.06;o.connect(g);g.connect(AC.destination);
      o.start();o.stop(AC.currentTime + (kind === 'ok' ? 0.08 : 0.3));
    } catch (e) {}
  }
  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 35 : [90, 60, 90]);
}
let fbT = null;
function feedback(r) {
  if (!r) return;
  const kind = r.kind || (r.ok ? 'ok' : 'bad');
  beep(kind);
  if (!$('camWrap').hidden) {
    const fb = $('camFb');
    fb.className = 'show ' + kind;
    fb.querySelector('b').textContent = r.msg || '';
    fb.querySelector('span').textContent = r.sub || '';
    const p = $('camPanel');p.classList.remove('flash-ok', 'flash-bad');void p.offsetWidth;
    p.classList.add(kind === 'ok' ? 'flash-ok' : 'flash-bad');
    clearTimeout(fbT);fbT = setTimeout(() => {fb.className = '';p.classList.remove('flash-ok', 'flash-bad');}, kind === 'ok' ? 1500 : 2600);
  } else toast(r.msg + (r.sub ? ' · ' + r.sub : ''), kind === 'ok' ? 'ok' : 'bad');
}
let toastT = null;
function toast(m, kind) {
  const t = $('toast');t.textContent = m;t.className = kind || '';t.hidden = false;
  clearTimeout(toastT);toastT = setTimeout(() => {t.hidden = true;}, 2600);
}

/* ================= กล้องสแกน ================= */
const Cam = { inst: null, on: false, starting: false, last: '', lastAt: 0 };
async function camStart() {
  if (Cam.on || Cam.starting) return;
  if (!window.Html5Qrcode) {$('camOvMsg').textContent = 'โหลดตัวสแกนไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่';return;}
  Cam.starting = true;$('camOvMsg').textContent = 'กำลังเปิดกล้อง…';
  try {
    const F = Html5QrcodeSupportedFormats;
    Cam.inst = Cam.inst || new Html5Qrcode('cam', {
      verbose: false,
      formatsToSupport: [F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.ITF],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    await Cam.inst.start({ facingMode: 'environment' }, {
      fps: 15, disableFlip: true,
      qrbox: (w, h) => ({ width: Math.max(160, Math.floor(w * 0.88)), height: Math.max(120, Math.floor(h * 0.7)) })
    }, onDecoded, () => {});
    Cam.on = true;$('camOverlay').hidden = true;$('camToggle').textContent = 'ปิดกล้อง';
  } catch (e) {
    $('camOverlay').hidden = false;
    $('camOvMsg').textContent = 'เปิดกล้องไม่ได้ (' + errMsg(e).slice(0, 80) + ') ' +
      (hasGas() ? 'ลิงก์ /exec ของ Google ใช้กล้องไม่ได้ ให้เปิดแอปจากลิงก์หน้าเว็บของร้าน (เช่น github.io) แทน' : 'ตรวจว่าอนุญาตกล้องให้เบราว์เซอร์แล้ว หรือใช้ปุ่มถ่ายรูป/พิมพ์รหัสแทน');
  } finally {Cam.starting = false;}
}
async function camStop() {
  if (Cam.inst && Cam.on) {try {await Cam.inst.stop();} catch (e) {}}
  Cam.on = false;$('camOverlay').hidden = false;$('camOvMsg').textContent = 'กล้องปิดอยู่';$('camToggle').textContent = 'เปิดกล้อง';
}
function onDecoded(text) {
  const now = Date.now();
  if (text === Cam.last && now - Cam.lastAt < 1300) return;
  Cam.last = text;Cam.lastAt = now;
  handleScan(text);
}
// เครื่องยิงบาร์โค้ดบลูทูธ/USB (พิมพ์เร็วแล้วกด Enter)
const KB = { buf: '', t: 0 };
document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const now = Date.now();
  if (now - KB.t > 90) KB.buf = '';
  KB.t = now;
  if (e.key === 'Enter') {if (KB.buf.length >= 2) handleScan(KB.buf);KB.buf = '';return;}
  if (e.key.length === 1) KB.buf += e.key;
});

/* ================= ตัวจัดการผลสแกน ================= */
function handleScan(raw) {
  const code = cleanScan(raw);
  if (!code) return;
  let r;
  if (S.view === 'pick') r = pickScan(code);else
  if (S.view === 'pack') r = packScan(code);else
  {
    const o = findOrder(code);
    if (o) {openDetail(o.orderNo);r = { ok: true, msg: '#' + o.orderNo, sub: o.customer };} else
    {S.f.q = code;render();r = { ok: false, msg: 'ค้นหา ' + code };}
  }
  feedback(r);
}

/* ---------- จัดของ ---------- */
function needStaff() {
  if (S.staff) return null;
  openStaff();
  return { ok: false, msg: 'เลือกชื่อผู้ใช้งานก่อน', sub: 'เพื่อบันทึกว่าใครจัด/ใครแพ็ค' };
}

function packDraftKey(no) {return 'pk_' + norm(no);}
function openPack(no) {

function packCounts(o) {

}
function packWarn(o) {

  if (o.pickStatus !== PICK.done) return { kind: 'warn', msg: '#' + o.orderNo + ' ยังจัดไม่ครบ', sub: 'จัดแล้ว ' + (o.pickedQty || 0) + '/' + (o.itemQty || 0) + ' ชิ้น' };
  if (o.payStatus !== PAY.paid) return { kind: 'warn', msg: '#' + o.orderNo + ' ' + o.payStatus, sub: o.customer };
  return { ok: true, msg: '#' + o.orderNo, sub: o.customer + ' · ' + (o.itemQty || 0) + ' ชิ้น' };
}
function packScan(code) {
  const k = norm(code);
  const cur = S.pk && S.byNo[S.pk.no];
  if (cur) {
    const it = itemsOf(cur).find((i) => norm(i.code) === k && !isSkip(i));
    if (it) {
      const n = S.pk.packed[it.code] || 0,q = qtyOf(it);
      if (n >= q) return { ok: false, msg: it.code + ' ครบแล้ว', sub: 'ต้องการ ' + q + ' ชิ้น' };
      S.pk.packed[it.code] = n + 1;S.pk.confirm = null;packSave();
      S.flashCode = norm(it.code);softRender();
      const c = packCounts(cur);
      const warnPick = pickedOf(it) < n + 1 ? ' (หน้าจัดยังไม่ได้ติ๊ก)' : '';
      return { ok: true, msg: it.code + '  ' + (n + 1) + '/' + q, sub: (c.done >= c.total ? 'ครบทุกชิ้นแล้ว ถ่ายรูปแล้วกดแพ็คเสร็จ' : 'เหลือ ' + (c.total - c.done) + ' ชิ้น') + warnPick };
    }

      const c = packCounts(cur);
      if (c.done === 0 && !S.pk.photos.length) {openPack(other.orderNo);return packWarn(other);}
      S.packChoices = { switchTo: norm(other.orderNo) };softRender();
      return { ok: false, msg: 'เป็นของออเดอร์ #' + other.orderNo, sub: 'ใบปะหน้า/ออเดอร์ไม่ตรง ถ้าจะสลับให้กดปุ่มด้านล่าง' };
    }

      S.pk.tracking = code;S.pk.labelOk = trks.length ? false : null;packSave();softRender();

    pickChip(o) + packChip(o) + payChip(o) + (o.note ? '<span class="chip warn">มีหมายเหตุ</span>' : '') + (Number(o.hold) ? '<span class="chip ai">มีของฝาก</span>' : '') + (o.pickedBy ? '<span class="chip">จัด: ' + esc(o.pickedBy) + '</span>' : '') + (o.packedBy ? '<span class="chip">แพ็ค: ' + esc(o.packedBy) + '</span>' : '') + "</div>\n      <div class=\"bar " + (

  }).join('') : "<div class=\"empty\">\u0E44\u0E21\u0E48\u0E21\u0E35\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C\u0E15\u0E32\u0E21\u0E15\u0E31\u0E27\u0E01\u0E23\u0E2D\u0E07\u0E19\u0E35\u0E49</div>";
}

/* ---------- หน้าจัดของ ---------- */

  esc(o.orderNo) + "</span>" + payChip(o) + "<button class=\"x\" data-act=\"" + (mode === 'pick' ? 'closePick' : 'closePack') + "\">\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C\u0E2D\u0E37\u0E48\u0E19</button></div>\n    <div><b>" +
  esc(o.customer || '-') + "</b> <span class=\"muted\">\xB7 " + esc(o.fbName || '') + "</span></div>\n    <div class=\"addr\">" +
  esc(o.phone || '') + " \xB7 " + esc(o.province || '') + " \xB7 " + esc(o.vrichCarrier || 'ไม่ระบุขนส่ง') + " " + (o.vrichTracking ? '<span class="code">' + esc(o.vrichTracking) + '</span>' : '') + "</div>\n    " + (
  o.note ? "<div class=\"note\">\u0E2B\u0E21\u0E32\u0E22\u0E40\u0E2B\u0E15\u0E38: " + esc(o.note) + "</div>" : '') + "\n    " + (
  Number(o.hold) ? "<div class=\"note\">\u0E25\u0E39\u0E01\u0E04\u0E49\u0E32\u0E21\u0E35\u0E02\u0E2D\u0E07\u0E1D\u0E32\u0E01\u0E44\u0E27\u0E49</div>" : '') + "\n    " + (
  o.payStatus !== PAY.paid ? "<div class=\"alert " + (o.payStatus === PAY.none ? 'bad' : 'warn') + "\">" + esc(o.payStatus) + " \xB7 \u0E42\u0E2D\u0E19 " + baht(o.paid) + " \u0E08\u0E32\u0E01 " + baht(o.total) + "</div>" : '') + "\n  </div>";

}
function waitingList(filterFn, mode, title) {
  const list = S.orders.filter(filterFn).sort((a, b) => (Number(a.orderNo) || 0) - (Number(b.orderNo) || 0));
  return "<div class=\"sec\">" + title + " (" + list.length + ")</div>\n    <div class=\"stack\">" + (
  list.slice(0, 60).map((o) => "<button class=\"ord\" data-act=\"" + mode + "\" data-no=\"" + esc(norm(o.orderNo)) + "\">\n      <div class=\"ord-top\"><span class=\"ord-no\">#" +
  esc(o.orderNo) + "</span><span class=\"ord-name\">" + esc(o.customer || '-') + "</span><span class=\"muted num\">" + (o.pickedQty || 0) + "/" + (o.itemQty || 0) + "</span></div>\n      <div class=\"chips\" style=\"margin-top:4px\">" +
  pickChip(o) + payChip(o) + (o.vrichTracking ? '<span class="chip code">' + esc(o.vrichTracking) + '</span>' : '<span class="chip">ไม่มีเลขพัสดุ</span>') + "</div></button>").join('') || '<div class="empty">ไม่มีออเดอร์ค้าง</div>') + "</div>";
}
function vPick() {
  const o = S.pickNo && S.byNo[S.pickNo];

    let ch = '';
    if (S.pickChoices) {
      ch = "<div class=\"card\"><b>\u0E23\u0E2B\u0E31\u0E2A <span class=\"code\">" + esc(S.pickChoices.code) + "</span> \u0E21\u0E35\u0E2B\u0E25\u0E32\u0E22\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C \u0E40\u0E25\u0E37\u0E2D\u0E01\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C\u0E17\u0E35\u0E48\u0E08\u0E30\u0E43\u0E2A\u0E48</b><div class=\"choose\" style=\"margin-top:8px\">" + S.pickChoices.nos.map((n) => S.byNo[n]).filter(Boolean).map((x) => "<button class=\"ord\" data-act=\"pickChoose\" data-no=\"" +
      esc(norm(x.orderNo)) + "\"><div class=\"ord-top\"><span class=\"ord-no\">#" + esc(x.orderNo) + "</span><span class=\"ord-name\">" + esc(x.customer) + "</span>" + payChip(x) + "</div></button>").join('') + "</div></div>";
    }
    return "<div class=\"stack\">" + ch + "\n      <div class=\"card\"><b>\u0E2A\u0E41\u0E01\u0E19\u0E40\u0E25\u0E02\u0E1E\u0E31\u0E2A\u0E14\u0E38 \u0E2B\u0E23\u0E37\u0E2D\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E40\u0E25\u0E02\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C</b><div class=\"muted\" style=\"font-size:13px\">\u0E2B\u0E23\u0E37\u0E2D\u0E2A\u0E41\u0E01\u0E19\u0E23\u0E2B\u0E31\u0E2A\u0E2A\u0E34\u0E19\u0E04\u0E49\u0E32\u0E44\u0E14\u0E49\u0E40\u0E25\u0E22 \u0E23\u0E30\u0E1A\u0E1A\u0E08\u0E30\u0E2B\u0E32\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C\u0E17\u0E35\u0E48\u0E15\u0E49\u0E2D\u0E07\u0E43\u0E2A\u0E48\u0E43\u0E2B\u0E49</div></div>\n      " +

    waitingList((x) => x.pickStatus !== PICK.done && x.packStatus !== PACK.done, 'openPick', 'รอจัด') + "</div>";

  o.pickStatus === PICK.done ? "<div class=\"alert ok\">\u0E08\u0E31\u0E14\u0E04\u0E23\u0E1A\u0E41\u0E25\u0E49\u0E27 \u2713<button data-act=\"toPack\" data-no=\"" + esc(norm(o.orderNo)) + "\"><span>\u0E44\u0E1B\u0E41\u0E1E\u0E47\u0E04</span></button></div>" : '') + "\n    <div class=\"items\">" +

  esc(norm(o.orderNo)) + "\">" + (S.confirmReset === 'pick' + norm(o.orderNo) ? 'แตะอีกครั้งเพื่อล้างการจัดทั้งหมด' : 'ล้างการจัด') + "</button></div>\n  </div>";

}
function itemRow(i, n, mode) {

  const st = n >= q ? 'done' : n > 0 ? 'part' : '';

  return "<div class=\"it " + st + "\" data-code=\"" + esc(norm(i.code)) + "\">\n    <span class=\"tick\">" + (
  n >= q ? '✓' : n > 0 ? n : '') + "</span>\n    <button class=\"min\" data-act=\"" +
  mode + "Inc\" data-c=\"" + esc(i.code) + "\" data-d=\"1\"><div class=\"code\">" + esc(i.code) + (q > 1 ? " <span class=\"chip ai\">x" + q + "</span>" : '') + "</div><div class=\"nm\">" + esc(i.name) + " \xB7 " + baht(i.price) + "</div>" + extra + "</button>\n    <div class=\"qty\"><button data-act=\"" +
  mode + "Inc\" data-c=\"" + esc(i.code) + "\" data-d=\"-1\" aria-label=\"\u0E25\u0E14\">\u2212</button><b>" + n + "/" + q + "</b><button class=\"plus\" data-act=\"" + mode + "Inc\" data-c=\"" + esc(i.code) + "\" data-d=\"1\" aria-label=\"\u0E40\u0E1E\u0E34\u0E48\u0E21\">+</button></div>\n  </div>";

}

/* ---------- หน้าแพ็ค ---------- */

      ch = "<div class=\"card\"><b>\u0E23\u0E2B\u0E31\u0E2A <span class=\"code\">" + esc(S.packChoices.code) + "</span> \u0E21\u0E35\u0E2B\u0E25\u0E32\u0E22\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C</b><div class=\"choose\" style=\"margin-top:8px\">" + S.packChoices.nos.map((n) => S.byNo[n]).filter(Boolean).map((x) => "<button class=\"ord\" data-act=\"openPack\" data-no=\"" +
      esc(norm(x.orderNo)) + "\"><div class=\"ord-top\"><span class=\"ord-no\">#" + esc(x.orderNo) + "</span><span class=\"ord-name\">" + esc(x.customer) + "</span>" + pickChip(x) + "</div></button>").join('') + "</div></div>";
    }
    return "<div class=\"stack\">" + ch + "\n      <div class=\"card\"><b>\u0E2A\u0E41\u0E01\u0E19\u0E40\u0E25\u0E02\u0E1E\u0E31\u0E2A\u0E14\u0E38\u0E1A\u0E19\u0E43\u0E1A\u0E1B\u0E30\u0E2B\u0E19\u0E49\u0E32 \u0E2B\u0E23\u0E37\u0E2D\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E40\u0E25\u0E02\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C</b><div class=\"muted\" style=\"font-size:13px\">\u0E41\u0E25\u0E49\u0E27\u0E2A\u0E41\u0E01\u0E19\u0E2A\u0E34\u0E19\u0E04\u0E49\u0E32\u0E17\u0E35\u0E25\u0E30\u0E0A\u0E34\u0E49\u0E19\u0E01\u0E48\u0E2D\u0E19\u0E43\u0E2A\u0E48\u0E01\u0E25\u0E48\u0E2D\u0E07</div></div>\n      " +

    waitingList((x) => x.pickStatus === PICK.done && x.packStatus !== PACK.done, 'openPack', 'จัดแล้ว รอแพ็ค') + "\n      " +
    waitingList((x) => x.pickStatus === PICK.part && x.packStatus !== PACK.done, 'openPack', 'จัดยังไม่ครบ') + "</div>";
  }
  const o = S.byNo[S.pk.no],pk = S.pk;
  const c = packCounts(o);
  const items = itemsOf(o).slice().sort((a, b) => isSkip(a) - isSkip(b) || ((pk.packed[a.code] || 0) >= qtyOf(a)) - ((pk.packed[b.code] || 0) >= qtyOf(b)));
  const carriers = S.carriers.slice();if (pk.carrier && !carriers.includes(pk.carrier)) carriers.unshift(pk.carrier);
  const label = pk.labelOk === true ? '<span class="chip ok">ใบปะหน้าตรง ✓</span>' : pk.labelOk === false ? '<span class="chip bad">ไม่ตรงกับ Vrich</span>' :
  o.vrichTracking ? '<span class="chip">สแกนใบปะหน้าเพื่อตรวจ</span>' : '';
  const photos = pk.photos.map((p) => "<div class=\"ph\">" + (p.thumb ? "<img src=\"" + p.thumb + "\" alt=\"\">" : p.url ? "<a href=\"" + esc(p.url) + "\" target=\"_blank\" style=\"display:grid;place-items:center;height:100%;font-size:12px\">\u0E40\u0E1B\u0E34\u0E14\u0E23\u0E39\u0E1B</a>" : '') + "\n    <span class=\"st\">" + (
  p.status === 'up' ? 'กำลังส่ง…' : p.status === 'err' ? 'ส่งไม่ได้' : 'บันทึกแล้ว') + "</span>\n    " + (
  p.status === 'err' ? "<button class=\"rm\" data-act=\"retryPhoto\" data-l=\"" + p.lid + "\" aria-label=\"\u0E2A\u0E48\u0E07\u0E43\u0E2B\u0E21\u0E48\">\u21BB</button>" : "<button class=\"rm\" data-act=\"rmPhoto\" data-l=\"" + p.lid + "\" aria-label=\"\u0E25\u0E1A\u0E23\u0E39\u0E1B\">\xD7</button>") + "</div>").join('');
  const issues = (pk.confirm || '').split('|').filter(Boolean);

  orderHead(o, 'pack') + "\n    " + (

  o.pickStatus !== PICK.done ? "<div class=\"alert warn\">\u0E2B\u0E19\u0E49\u0E32\u0E08\u0E31\u0E14\u0E02\u0E2D\u0E07\u0E22\u0E31\u0E07\u0E44\u0E21\u0E48\u0E04\u0E23\u0E1A (" + (o.pickedQty || 0) + "/" + (o.itemQty || 0) + ")</div>" : '') + "\n    " + (

  items.map((i) => itemRow(i, Math.min(qtyOf(i), pk.packed[i.code] || 0), 'pack')).join('') + "</div>\n    <div class=\"card stack\">\n      <div class=\"row2\">\n        <label class=\"field\"><span>\u0E02\u0E19\u0E2A\u0E48\u0E07</span><select id=\"pkCarrier\">" +

  esc(pk.note) + "\" placeholder=\"\u0E40\u0E0A\u0E48\u0E19 \u0E43\u0E2A\u0E48\u0E01\u0E25\u0E48\u0E2D\u0E07 M+, \u0E2B\u0E48\u0E2D\u0E1A\u0E31\u0E1A\u0E40\u0E1A\u0E34\u0E49\u0E25\"></label>\n      <div class=\"muted\" style=\"font-size:13px\">\u0E41\u0E1E\u0E47\u0E04\u0E42\u0E14\u0E22 <b style=\"color:var(--ink)\">" +

function vSummary() {
  const t = today(),rows = {};
  S.orders.forEach((o) => {
    if (o.pickStatus === PICK.done && String(o.pickedAt).slice(0, 10) === t && o.pickedBy) {const r = rows[o.pickedBy] = rows[o.pickedBy] || { p: 0, pq: 0, k: 0, kq: 0 };r.p++;r.pq += Number(o.itemQty) || 0;}
    if (o.packStatus === PACK.done && String(o.packedAt).slice(0, 10) === t && o.packedBy) {const r = rows[o.packedBy] = rows[o.packedBy] || { p: 0, pq: 0, k: 0, kq: 0 };r.k++;r.kq += Number(o.itemQty) || 0;}
  });
  const names = Object.keys(rows);
  return "<div class=\"stack\">" + back() + "<div class=\"card\"><h2>\u0E2A\u0E23\u0E38\u0E1B\u0E27\u0E31\u0E19\u0E17\u0E35\u0E48 " + t + "</h2>\n    " + (
  names.length ? "<table class=\"sum\"><thead><tr><th>\u0E1E\u0E19\u0E31\u0E01\u0E07\u0E32\u0E19</th><th class=\"n\">\u0E08\u0E31\u0E14\u0E40\u0E2A\u0E23\u0E47\u0E08</th><th class=\"n\">\u0E41\u0E1E\u0E47\u0E04</th></tr></thead><tbody>\n    " +

function vLabels() {

  S.labelSize === 's5030' ? 'selected' : '') + ">50\xD730 \u0E21\u0E21.</option><option value=\"sA4\" " + (S.labelSize === 'sA4' ? 'selected' : '') + ">A4 21 \u0E14\u0E27\u0E07</option></select></label>\n      <label class=\"field\"><span>\u0E04\u0E49\u0E19\u0E2B\u0E32</span><input id=\"lblQ\" value=\"" +
  esc(S.labelQ) + "\" placeholder=\"\u0E23\u0E2B\u0E31\u0E2A/\u0E0A\u0E37\u0E48\u0E2D\"></label></div>\n      <label class=\"toggle\"><span>\u0E40\u0E09\u0E1E\u0E32\u0E30\u0E2A\u0E34\u0E19\u0E04\u0E49\u0E32\u0E43\u0E19\u0E2D\u0E2D\u0E40\u0E14\u0E2D\u0E23\u0E4C\u0E17\u0E35\u0E48\u0E22\u0E31\u0E07\u0E44\u0E21\u0E48\u0E41\u0E1E\u0E47\u0E04</span><input type=\"checkbox\" id=\"lblOpen\" " + (
  S.labelOnlyOpen ? 'checked' : '') + "></label>\n      <div class=\"btns\"><button class=\"btn\" data-act=\"lblAll\">\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E17\u0E31\u0E49\u0E07\u0E2B\u0E21\u0E14 (" +
  list.length + ")</button><button class=\"btn\" data-act=\"lblNone\">\u0E25\u0E49\u0E32\u0E07</button>\n      <button class=\"btn pri\" data-act=\"lblPrint\" " + (
  sel.size ? '' : 'disabled') + ">\u0E1E\u0E34\u0E21\u0E1E\u0E4C " + sel.size + " \u0E14\u0E27\u0E07</button></div>\n    </div>\n    <div class=\"list\">" + (

  list.slice(0, 400).map((p) => "<label class=\"lrow\"><input type=\"checkbox\" data-lbl=\"" + esc(p.code) + "\" " + (sel.has(p.code) ? 'checked' : '') + ">\n      <span class=\"code\" style=\"min-width:56px\">" +
  esc(p.code) + "</span><span class=\"grow nm\" style=\"font-size:13px\">" + esc(p.name) + "</span><span class=\"num muted\">" + baht(p.price) + "</span></label>").join('') || '<div class="empty">ไม่พบสินค้า</div>') + "</div>\n  </div>";

}
function labelList() {
  const m = {};
  (S.products || []).forEach((p) => {m[norm(p.code)] = { code: String(p.code), name: p.name || '', price: p.price };});
  Object.values(S.itemsBy).forEach((arr) => arr.forEach((i) => {if (!isSkip(i) && !m[norm(i.code)]) m[norm(i.code)] = { code: String(i.code), name: i.name || '', price: i.price };}));
  return Object.values(m).sort((a, b) => a.code.localeCompare(b.code, 'th', { numeric: true }));
}
let qrLib = null;
function loadScript(src) {return new Promise((res, rej) => {const s = document.createElement('script');s.src = src;s.onload = res;s.onerror = () => rej(new Error('โหลดไม่สำเร็จ ' + src));document.head.appendChild(s);});}
async function printLabels() {
  if (!window.qrcode) await loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js');
  const all = labelList().filter((p) => S.labelSel.has(p.code));
  const html = all.map((p) => {
    const qr = qrcode(0, 'M');qr.addData(encodeURIComponent(p.code));qr.make();
    return "<div class=\"lbl\"><img src=\"" + qr.createDataURL(4, 0) + "\" alt=\"\"><div class=\"t\"><div class=\"c\">" + esc(p.code) + "</div><div class=\"n\">" + esc(p.name) + "</div><div class=\"p\">" + baht(p.price) + "</div></div></div>";
  }).join('');
  const pa = $('printArea');pa.className = S.labelSize;pa.innerHTML = html;
  let st = $('pageStyle');if (!st) {st = document.createElement('style');st.id = 'pageStyle';document.head.appendChild(st);}
  st.textContent = S.labelSize === 's5030' ? '@page{size:50mm 30mm;margin:0}' : '@page{size:A4;margin:10mm 0}';

/* ---------- นำเข้า Vrich ---------- */
async function readVrich(file) {
  S.more = 'import';S.imp = null;go('more');
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    let orderRows = null,stockRows = [];
    wb.SheetNames.forEach((n) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '' });
      if (!rows.length) return;
      const keys = Object.keys(rows[0]);
      if (keys.includes('เลขที่ Order') && keys.includes('รหัสสินค้า')) orderRows = rows;else
      if (keys.includes('รหัสสินค้า') && keys.includes('ยอดคงเหลือ')) stockRows = rows;
    });
    if (!orderRows) throw new Error('ไม่พบชีตออเดอร์ (ต้องมีคอลัมน์ "เลขที่ Order" และ "รหัสสินค้า") ใช้ไฟล์ export ออเดอร์จาก Vrich');
    const d = (v) => v instanceof Date ? v.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }) : String(v || '').slice(0, 10);
    const str = (v) => String(v == null ? '' : v).trim();
    const phone = (v) => {let s = str(v).replace(/\D/g, '');if (s.length === 9) s = '0' + s;return s;};
    const n = (v) => Number(String(v).replace(/,/g, '')) || 0;
    const orders = {},items = {};
    orderRows.forEach((r) => {
      const no = str(r['เลขที่ Order']);if (!no) return;
      if (!orders[no]) orders[no] = {
        orderNo: no, date: d(r['วันที่']), fbName: str(r['ชื่อ Facebook']), customer: str(r['ชื่อลูกค้า']),
        phone: phone(r['โทรศัพท์']), address: str(r['ที่อยู่']), province: str(r['จังหวัด']), zip: str(r['รหัสไปรษณีย์']),
        note: str(r['หมายเหตุ']), hold: n(r['มีของฝาก']), vrichCarrier: str(r['ขนส่ง']), vrichTracking: str(r['เลขพัสดุ']),
        amount: n(r['จำนวนเงิน']), discount: n(r['ส่วนลด']), shipping: n(r['ค่าส่ง']), total: n(r['รวม']), paid: n(r['โอนแล้ว'])
      };
      const code = str(r['รหัสสินค้า']);if (!code) return;
      const key = no + '|' + norm(code);
      if (items[key]) items[key].qty += n(r['จำนวน']) || 1;else
      items[key] = { orderNo: no, code: code, name: str(r['รายละเอียด']), qty: n(r['จำนวน']) || 1, price: n(r['ราคา']) };
    });
    const products = stockRows.map((r) => ({ code: str(r['รหัสสินค้า']), stockCode: str(r['รหัสสต็อก']), name: str(r['รายละเอียด']), price: n(r['ราคา']), qty: n(r['จำนวน']), sold: n(r['ขายไป']), remain: n(r['ยอดคงเหลือ']) })).filter((p) => p.code);
    S.imp = { fileName: file.name, orders: Object.values(orders), items: Object.values(items), products: products };
  } catch (e) {S.imp = { error: errMsg(e) };}
  render();
}
async function doImport() {
  const im = S.imp;if (!im || im.busy) return;
  im.busy = true;render();
  try {
    const r = await api('importVrich', { orders: im.orders, items: im.items, products: im.products, by: S.staff });
    await refresh(true);
    S.products = null;
    toast("\u0E19\u0E33\u0E40\u0E02\u0E49\u0E32\u0E41\u0E25\u0E49\u0E27: \u0E43\u0E2B\u0E21\u0E48 " + r.added + " \u0E2D\u0E31\u0E1B\u0E40\u0E14\u0E15 " + r.updated + " ออเดอร์" + (r.archived ? " · ย้ายเข้าคลัง " + r.archived : "") + (r.skipped ? " · ข้าม " + r.skipped + " ที่แพ็คไปแล้ว" : ""), 'ok');
    S.imp = null;S.more = null;go('orders');
  } catch (e) {im.busy = false;toast('นำเข้าไม่สำเร็จ: ' + errMsg(e), 'bad');render();}
}

async function refresh(quiet) {
  if (Q.list.length) {qKick();if (!quiet) toast('ยังมีข้อมูลรอส่ง ' + Q.list.length + ' รายการ ส่งให้ครบก่อนแล้วค่อยดึงใหม่');return;}

const ACT = {
  go: (d) => {if (d.v === 'more') S.more = null;go(d.v);},
  pickStaff: openStaff,
  setStaff: (d) => {S.staff = d.n;LS.set('staff', d.n);closeSheet();render();},
  closeSheet: () => closeSheet(),
  camOn: () => camStart(),
  camToggle: () => Cam.on ? camStop() : camStart(),
  photoScan: () => $('fileScan').click(),
  filt: (d) => {S.f[d.k] = d.val;render();},
  tile: (d, el) => {Object.assign(S.f, JSON.parse(el.dataset.set));render();},
  detail: (d) => openDetail(d.no),
  sheetPick: (d) => {closeSheet();openPick(d.no);const o = S.byNo[d.no];if (o) feedback(pickWarn(o));},
  sheetPack: (d) => {closeSheet();openPack(d.no);},
  openPick: (d) => {openPick(d.no);const o = S.byNo[d.no];if (o) feedback(pickWarn(o));},
  pickChoose: (d) => {const code = S.pickChoices.code;openPick(d.no);const o = S.byNo[d.no];const it = itemsOf(o).find((i) => norm(i.code) === norm(code));feedback(pickInc(o, it, 1));},
  closePick: () => {S.pickNo = null;S.pickChoices = null;render();},
  pickInc: (d) => {const o = S.byNo[S.pickNo];const it = itemsOf(o).find((i) => i.code === d.c);const r = pickInc(o, it, Number(d.d));if (r && !r.ok) feedback(r);else if (r && Number(d.d) > 0) beep('ok');},
  toPack: (d) => openPack(d.no),
  resetPick: (d) => {
    if (S.confirmReset !== 'pick' + d.no) {S.confirmReset = 'pick' + d.no;render();return;}
    S.confirmReset = null;const o = S.byNo[d.no];
    itemsOf(o).forEach((i) => {i.pickedQty = 0;i.pickedBy = '';i.packedQty = 0;});o.pickedBy = '';o.packStatus = PACK.none;o.packedBy = '';recalc(o);
    enqueue({ type: 'reset', orderNo: String(o.orderNo), which: 'pick', staff: S.staff });render();
  },
  openPack: (d) => {openPack(d.no);const o = S.byNo[d.no];if (o) feedback(packWarn(o));},
  closePack: () => {S.pk = null;S.packChoices = null;render();},
  packInc: (d) => {
    const o = S.byNo[S.pk.no];const it = itemsOf(o).find((i) => i.code === d.c);
    const n = S.pk.packed[it.code] || 0,q = qtyOf(it),dd = Number(d.d);
    S.pk.packed[it.code] = Math.max(0, Math.min(q, n + dd));S.pk.confirm = null;packSave();render();
    if (dd > 0 && n < q) beep('ok');
  },
  finishPack: () => finishPack(),
  rmPhoto: (d) => {const i = S.pk.photos.findIndex((p) => p.lid === d.l);if (i < 0) return;const p = S.pk.photos.splice(i, 1)[0];if (p.id) api('deletePhoto', p.id).catch(() => {});packSave();render();},
  retryPhoto: (d) => {const i = S.pk.photos.findIndex((p) => p.lid === d.l);if (i < 0) return;const p = S.pk.photos.splice(i, 1)[0];if (p.file) addPhotos([p.file]);},
  resetPack: (d) => {
    if (S.confirmReset !== 'pack' + d.no) {S.confirmReset = 'pack' + d.no;render();return;}
    S.confirmReset = null;const o = S.byNo[d.no];
    itemsOf(o).forEach((i) => {i.packedQty = 0;});Object.assign(o, { packStatus: PACK.none, packedBy: '', packedAt: '' });
    LS.del(packDraftKey(d.no));enqueue({ type: 'reset', orderNo: String(o.orderNo), which: 'pack', staff: S.staff });openPack(d.no);
  },
  more: (d) => {S.more = d.m || null;if (d.m === 'labels' && !S.products) loadProducts();render();$('main').scrollTop = 0;},
  startImport: () => $('fileImport').click(),
  doImport: () => doImport(),
  refresh: () => refresh(),
  lblAll: () => {(S._labelList || []).forEach((p) => S.labelSel.add(p.code));render();},
  lblNone: () => {S.labelSel.clear();render();},
  share: () => {
    const link = shareLink();
    $('sheetRoot').innerHTML = '<div class="sheetBg" data-act="closeSheet"><div class="sheet" data-stop="1"><div class="grab"></div><div class="stack">' +
      '<h2>ลิงก์สำหรับพนักงาน</h2><div class="muted" style="font-size:13px">ส่งทางแชตส่วนตัวหรือกลุ่มร้านเท่านั้น ใครมีลิงก์นี้จะเห็นข้อมูลออเดอร์ได้ ถ้าลิงก์หลุด ให้เปลี่ยนรหัสในชีต Settings</div>' +
      '<textarea id="shareTxt" readonly rows="4" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font-size:12px">' + esc(link) + '</textarea>' +
      '<button class="big" data-act="copyShare">คัดลอกลิงก์</button></div></div></div>';
  },
  copyShare: () => {
    const t = $('shareTxt');
    const done = () => toast('คัดลอกแล้ว', 'ok');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); });
    else { t.select(); document.execCommand('copy'); done(); }
  },
  reconnect: () => { closeSheet(); $('main').innerHTML = ''; const l = document.createElement('div'); l.id = 'loading'; document.body.appendChild(l); showConnect(''); },

};
async function loadProducts() {try {S.products = await api('getProducts');} catch (e) {S.products = [];toast('โหลดสินค้าไม่ได้: ' + errMsg(e), 'bad');}render();}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheetBg') && e.target !== el) return;
  e.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') {S.f.q = t.value;renderOrderList();} else
  if (t.id === 'pkTrack' && S.pk) {
    S.pk.tracking = t.value.trim();
    const o = S.byNo[S.pk.no];const v = norm(t.value);
    S.pk.labelOk = !v ? null : o && o.vrichTracking ? norm(o.vrichTracking) === v : null;
    S.pk.confirm = null;packSave();
  } else
  if (t.id === 'pkNote' && S.pk) {S.pk.note = t.value;packSave();} else
  if (t.id === 'lblQ') {S.labelQ = t.value;clearTimeout(S._lq);S._lq = setTimeout(() => {render();const i = $('lblQ');if (i) {i.focus();i.setSelectionRange(i.value.length, i.value.length);}}, 250);}
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'fPicker') {S.f.picker = t.value;renderOrderList();} else
  if (t.id === 'fPacker') {S.f.packer = t.value;renderOrderList();} else
  if (t.id === 'fDate') {S.f.date = t.value;renderOrderList();} else
  if (t.id === 'pkCarrier' && S.pk) {S.pk.carrier = t.value;packSave();} else
  if (t.id === 'pkTrack') softRender();else
  if (t.dataset.set) {S.set[t.dataset.set] = t.checked;LS.set('set', S.set);} else
  if (t.dataset.lbl !== undefined && t.dataset.lbl !== '') {t.checked ? S.labelSel.add(t.dataset.lbl) : S.labelSel.delete(t.dataset.lbl);softRender();} else
  if (t.id === 'lblOpen') {S.labelOnlyOpen = t.checked;render();} else
  if (t.id === 'lblSize') {S.labelSize = t.value;} else
  if (t.id === 'filePhoto') {const f = [...t.files];t.value = '';addPhotos(f);} else
  if (t.id === 'fileImport') {const f = t.files[0];t.value = '';if (f) readVrich(f);} else
  if (t.id === 'fileScan') {
    const f = t.files[0];t.value = '';if (!f) return;
    const wasOn = Cam.on;
    (async () => {
      if (wasOn) await camStop();
      try {const r = new Html5Qrcode('camFileBox', { verbose: false });const txt = await r.scanFile(f, false);handleScan(txt);}
      catch (err) {feedback({ ok: false, msg: 'อ่านบาร์โค้ดจากรูปไม่ได้', sub: 'ถ่ายให้ชัด ใกล้ขึ้น และมีแสงพอ' });}
      if (wasOn) camStart();
    })();
  }
});
$('manualForm').addEventListener('submit', (e) => {

});
document.addEventListener('visibilitychange', () => {

setInterval(() => {if (!document.hidden && !Q.list.length && !Q.busy && S.view === 'orders') refresh(true);}, 60000);

  Object.assign(S.set, LS.get('set', {}));

    return;
  }
  window.__booted = true;
  $('loading').remove();
  go('orders');
  if (!S.staff) openStaff();
  if (Q.list.length) qKick(500);
})();
